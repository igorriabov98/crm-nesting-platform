name: CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_call:

jobs:
  checks:
    name: checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            package-lock.json
            nesting-service/package-lock.json
      - name: Install root dependencies
        run: npm ci
      - name: Install nesting-service dependencies
        run: npm ci
        working-directory: nesting-service
      - name: Generate Prisma client
        run: npx prisma generate
        working-directory: nesting-service
      - name: Typecheck root
        run: npx tsc --noEmit
      - name: Access control registry and policies
        run: npm run test:access-control
      - name: Product PDF and STEP upload rules
        run: npm run test:product-file-uploads
      - name: Restricted product production drawing rules
        run: npm run test:product-production-drawings
      - name: User impersonation session helpers
        run: npm run test:user-impersonation
      - name: Supply reservation stock scope
        run: npm run test:supply-reservation-scope
      - name: Supply order filters and sorting
        run: npm run test:supply-order-view
      - name: Supply long-stock purchase plan and return contract
        run: npm run test:supply-long-stock-plan-return
      - name: Supply request lifecycle
        run: npm run test:supply-request-flow
      - name: Supabase migration ordering and duplicate versions
        run: npm run test:supabase-migration-order
      - name: Technologist request editability
        run: npm run test:technologist-request-editability
      - name: Technologist completion plan facts
        run: npm run test:technologist-completion
      - name: Production cutting area request view
        run: npm run test:production-cutting-area
      - name: Long-stock cutting-plan PDF
        run: npm run test:long-stock-cutting-plan-pdf
      - name: Long-stock cutting solver
        run: npm run test:long-stock-cutting-solver
      - name: Long-stock layout settings
        run: npm run test:long-stock-layout-settings
      - name: Long-stock position UI
        run: npm run test:long-stock-position-ui
      - name: Material request stock coverage
        run: npm run test:material-request-stock-coverage
      - name: Nesting STEP/PDF dimension choice
        run: npm run test:nesting-dimension-choice
      - name: Nesting AI match application policy
        run: npm run test:nesting-ai-match-policy
      - name: Typecheck nesting-service
        run: npx tsc --noEmit
        working-directory: nesting-service
      - name: Build nesting-service
        run: npm run build
        working-directory: nesting-service

  root-build:
    name: root build
    runs-on: ubuntu-latest
    env:
      NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
      NEXT_PUBLIC_SUPABASE_ANON_KEY: dummy
      SUPABASE_SERVICE_ROLE_KEY: dummy
      NEXT_PUBLIC_APP_URL: http://localhost:3000
      NESTING_SERVICE_URL: http://localhost:4000
      NESTING_SERVICE_SECRET: dummy
      TELEGRAM_BOT_TOKEN: dummy
      TELEGRAM_WEBHOOK_SECRET: dummy
      MEETING_REMINDER_CRON_SECRET: dummy
      CRON_SECRET: dummy
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Install root dependencies
        run: npm ci
      - name: Build root
        run: npm run build

  tests:
    name: tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: inventory_test
          POSTGRES_PASSWORD: postgres
          POSTGRES_USER: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d inventory_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      TEST_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/inventory_test
      FULL_SCHEMA_TEST_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/inventory_test
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            package-lock.json
            nesting-service/package-lock.json
      - name: Install root dependencies
        run: npm ci
      - name: Install nesting-service dependencies
        run: npm ci
        working-directory: nesting-service
      - name: Generate fixtures
        run: npm run fixtures
        working-directory: nesting-service
      - name: Task partial-index ON CONFLICT regression
        run: npm run test:task-on-conflict
      - name: Shipping task schedule and factory reservation source
        run: npm run test:shipping-factory
      - name: Inventory stock lifecycle
        run: node scripts/test-inventory-stock-lifecycle.mjs
      - name: Inventory factory transfers
        run: npm run test:inventory-transfers
      - name: Long-stock cutting fact
        run: npm run test:long-stock-cutting-fact
      - name: Long-stock cutting-plan schema
        run: npm run test:long-stock-cutting-plan-schema
      - name: Supply partial receiving
        run: node scripts/test-supply-partial-receiving.mjs
      - name: Supply receiving plan/fact database lifecycle
        run: npm run test:supply-receiving-plan-fact
      - name: Long-stock receipt recalculation database lifecycle
        run: npm run test:long-stock-cutting-plan-receipt-recalculation
      - name: Fixtures are stable
        run: git diff --exit-code -- nesting-service/src/lib/__tests__/fixtures/
      - name: Phase 0
        run: npm run test:phase0
        working-directory: nesting-service
      - name: Phase 1
        run: npm run test:phase1
        working-directory: nesting-service
      - name: Phase 2
        run: npm run test:phase2
        working-directory: nesting-service
      - name: All nesting-service tests
        run: npm run test:all
        working-directory: nesting-service
      - name: Long-stock cutting-plan server
        env:
          FULL_SCHEMA_TEST_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/inventory_test
        run: npm run test:long-stock-cutting-plan-server

  real-fixtures:
    name: real fixtures
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: nesting-service/package-lock.json
      - name: Install nesting-service dependencies
        run: npm ci
        working-directory: nesting-service
      - name: Real STEP fixtures
        run: npm run test:real
        working-directory: nesting-service
